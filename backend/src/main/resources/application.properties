spring.application.name=backend

# --- Database ---
# Values are sourced from environment variables in every environment.
# Local dev fallbacks are provided after the ':' purely for convenience.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lost_and_found}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- JWT ---
# jwt.secret MUST be overridden via the JWT_SECRET env var in staging/production.
# The fallback below is for local development only.
jwt.secret=${JWT_SECRET:841D8A6C80CBA4FCAD32D5367C18C53B23351C9081273C85E48B01DF69094B1B}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# --- CORS ---
# Comma-separated list of origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Initial admin account (see AdminAccountInitializer) ---
# Set ADMIN_EMAIL and ADMIN_PASSWORD in the deployment environment to provision
# the first admin. Leave unset to skip seeding entirely.
app.admin.seed-email=${ADMIN_EMAIL:}
app.admin.seed-password=${ADMIN_PASSWORD:}
app.admin.seed-name=${ADMIN_NAME:System Admin}

# --- Misc ---
server.error.include-stacktrace=never
server.error.include-message=never

