spring.application.name=backend
server.port=8087

# =========================
# Database
# =========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}



app.admin.seed-email=${ADMIN_EMAIL:}
app.admin.seed-password=${ADMIN_PASSWORD:}
app.admin.seed-name=${ADMIN_NAME:System Admin}



spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}